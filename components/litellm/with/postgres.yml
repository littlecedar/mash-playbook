---

litellm_database_postgres_hostname: "{{ postgres_connection_hostname if postgres_enabled | default(false) else '' }}"
litellm_database_postgres_port: "{{ postgres_connection_port if postgres_enabled | default(false) else '5432' }}"
litellm_database_postgres_username: "{{ litellm_identifier }}"
litellm_database_postgres_password: "{{ (mash_playbook_generic_secret_key + ':db.litellm') | hash('sha512') | to_uuid }}"
