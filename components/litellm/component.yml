---

activation_prefix: litellm_
description: LiteLLM is one gateway for all your models, tools, and agents.

# Entries added to other components' lists, while those components are in use
inject:
  systemd_service_manager:
    services:
    - name: "{{ litellm_identifier }}.service"
      priority: 2000
      groups: [mash, litellm]
      when: "{{ litellm_enabled }}"
      restart_necessary: "{{ litellm_restart_necessary }}"
  postgres:
    managed_databases:
      - name: "{{ litellm_database_name }}"
        username: "{{ litellm_database_postgres_username }}"
        password: "{{ litellm_database_postgres_password }}"
        when: "{{ litellm_enabled and (litellm_database_postgres_hostname == postgres_connection_hostname) }}"
