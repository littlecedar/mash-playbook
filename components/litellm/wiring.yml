---

# The role enables itself by default. It stays disabled, unless enabled in your inventory.
litellm_enabled: false

litellm_identifier: "{{ mash_playbook_service_identifier_prefix }}litellm"

litellm_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}litellm"

litellm_systemd_required_services_list_auto: |
  {{
    ([postgres_identifier ~ '.service'] if postgres_enabled | default(false) and (litellm_database_postgres_hostname == postgres_connection_hostname) else [])
  }}

litellm_container_additional_networks_auto: |
  {{
    ([mash_playbook_reverse_proxyable_services_additional_network] if mash_playbook_reverse_proxyable_services_additional_network else [])
    +
    ([postgres_container_network] if postgres_enabled | default(false) and (litellm_database_postgres_hostname == postgres_connection_hostname) and litellm_container_network != postgres_container_network else [])
  }}

litellm_uid: "{{ mash_playbook_uid }}"
litellm_gid: "{{ mash_playbook_gid }}"

litellm_container_labels_traefik_enabled: "{{ mash_playbook_traefik_labels_enabled }}"
litellm_container_labels_traefik_docker_network: "{{ mash_playbook_reverse_proxyable_services_additional_network }}"
