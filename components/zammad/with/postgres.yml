---

zammad_database_hostname: "{{ postgres_connection_hostname if postgres_enabled else '' }}"
zammad_database_port: "{{ postgres_connection_port if postgres_enabled else '5432' }}"
zammad_database_password: "{{ (mash_playbook_generic_secret_key + ':db.zammad') | hash('sha512') | to_uuid }}"
