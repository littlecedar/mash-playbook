---

# The role enables the Compose stack and its feed-sync timer by itself. It stays disabled, unless enabled in your inventory.
greenbone_enabled: false

greenbone_identifier: "{{ mash_playbook_service_identifier_prefix }}greenbone"

greenbone_base_path: "{{ mash_playbook_base_path }}/{{ mash_playbook_service_base_directory_name_prefix }}greenbone"

# Centurion already runs at /opt/siem/greenbone on port 9443.
# Set greenbone_base_path in that host's vars before enabling the role.
